# ── Webhooks / OAuth callbacks (precisam ser públicos: chamados por serviços externos) ──
[functions.mercado-pago-webhook]
verify_jwt = false

[functions.mercado-pago-oauth-callback]
verify_jwt = false

[functions.mercado-pago-oauth-start]
verify_jwt = true

# ── Crons (protegidos por x-cron-secret no próprio código; gateway JWT deve ficar OFF) ──
[functions.cron-limpeza-agenda]
verify_jwt = false

[functions.cron-email-mensagens-nao-lidas]
verify_jwt = false

[functions.cron-retentar-estornos]
verify_jwt = false

[functions.mp-refresh-tokens]
verify_jwt = false

# ── Pagamento com cartão (chamadas do browser com sessão; validam getUser no código) ──
[functions.mercadopago-cartao-init]
verify_jwt = true

[functions.mercadopago-cartao-processar]
verify_jwt = true

# ── Estorno: chamado pelo cliente/admin (sessão) E internamente pelo cron (service_role).
#    Por causa da chamada interna, o gateway JWT precisa ficar OFF; a função valida o
#    token manualmente via getUser e trata o caller interno (service_role). ──
[functions.processar-estorno]
verify_jwt = false

# ── Ações administrativas sensíveis (validam admin no código via getUser) ──
[functions.manage-professionals]
verify_jwt = true

[functions.impersonate-user]
verify_jwt = true

# ── Utilitários de teste (validam no código) ──
[functions.seed-test-data]
verify_jwt = true

[functions.reset-test-data]
verify_jwt = true
