<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Marido pra Quê?</title>
    <style>
      :root { color-scheme: light; }
      html, body {
        margin: 0; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #FF6B35; color: #fff;
      }
      .wrap {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center; padding: 24px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; font-weight: 800; }
      p { font-size: 15px; opacity: .9; margin: 0 0 24px; max-width: 320px; line-height: 1.5; }
      button {
        background: #fff; color: #FF6B35; border: 0; border-radius: 999px;
        font-weight: 800; font-size: 15px; padding: 12px 28px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!--
      Página de fallback offline empacotada no app. Em uso normal o Capacitor
      carrega o site publicado (server.url). Esta tela só aparece se o
      dispositivo estiver sem conexão na primeira abertura.
    -->
    <div class="wrap">
      <h1>Sem conexão</h1>
      <p>Não foi possível carregar o Marido pra Quê?. Verifique sua internet e tente novamente.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
