name: App Android (APK de teste)

# Monta um APK de teste do app na nuvem, sem precisar de Android Studio nem
# terminal. Rode manualmente pelo botão "Run workflow" na aba Actions do GitHub,
# ou ele roda sozinho quando algo do app nativo muda.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "mobile/**"
      - ".github/workflows/android-debug.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Montar APK de teste
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: marido-pra-que-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
