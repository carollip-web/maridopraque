name: App Android (AAB assinado p/ Play Store)

# Monta o pacote ASSINADO (.aab) para enviar à Google Play.
# Requer 4 secrets no GitHub (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  -> conteúdo do keystore em base64
#   ANDROID_KEYSTORE_PASSWORD-> senha do keystore
#   ANDROID_KEY_ALIAS        -> alias da chave (upload)
#   ANDROID_KEY_PASSWORD     -> senha da chave (igual à do keystore neste setup)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Restaurar keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Montar AAB assinado
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload-keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Publicar o AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: marido-pra-que-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
